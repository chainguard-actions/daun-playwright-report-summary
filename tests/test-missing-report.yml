name: Test missing report file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          report-file: tests/fixtures/does-not-exist.json
          create-comment: 'false'
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUMMARY: ${{ steps.action.outputs.summary }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for missing report file"
            exit 1
          fi
          if [ -n "$SUMMARY" ]; then
            echo "FAIL: summary should be empty"
            exit 1
          fi
          echo "PASS"
