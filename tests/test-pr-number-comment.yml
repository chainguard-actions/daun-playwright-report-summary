name: Test commenting with explicit pr-number
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          report-file: tests/fixtures/report.json
          pr-number: '1'
          create-comment: 'true'
          report-tag: act-test
      - name: Assert action ran (comment created, or API failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUMMARY: ${{ steps.action.outputs.summary }}
          COMMENT_ID: ${{ steps.action.outputs.comment-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "comment-id: '$COMMENT_ID'"
          echo "$SUMMARY"
          if [ "$OUTCOME" = "success" ]; then
            if ! printf '%s' "$SUMMARY" | grep -qF "### Playwright test results"; then
              echo "FAIL: action succeeded but summary is missing/incorrect"
              exit 1
            fi
            echo "PASS: summary rendered (comment-id '$COMMENT_ID')"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
